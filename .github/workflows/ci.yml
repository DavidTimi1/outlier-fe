name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pin Fe 26.6.0 (native Keccak requires >= 26.6.0).
  FE_VERSION: v26.6.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check ingots
      - run: fe check
      - run: fe check ingots/outlier_core --backend native
      - run: fe check ingots/testkit --backend native
      - run: fe check ingots/outlier_cli --backend native
      - run: fe test -i outlier_core
      - run: fe test -i outlier_core --backend native
      - run: fe test -i outlier_table
      - run: fe test -i testkit
      - run: fe test -i testkit --backend native
      - run: fe test -i outlier_cli --backend native
      - run: fe build -i outlier_table --emit sizes,bytecode,abi --out-dir out
      - run: fe build -i outlier_cli --backend native --emit executable --out-dir out
      - run: ./scripts/check_compile_fail.sh
      - run: python3 oracle/outlier_model.py --finish 2 --cap 3 --stake 3
      - run: ./out/outlier_cli vectors
      - run: ./out/outlier_cli replay demo/game1.log
      - run: ./out/outlier_cli replay demo/game2_forfeit.log
